<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self' https://qtrqkygwkjwblkztrmcu.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'" />
<meta name="referrer" content="same-origin" />
<title>Log in | ByteBox</title>
<link rel="stylesheet" href="bytebox-theme.css" />
</head>
<body data-page="login">
<header id="site-header"></header>
<main><section class="page"><div class="container">
<h2>Log in</h2>
<div id="msg"></div>
<form id="login-form" class="card-form">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required maxlength="254" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required maxlength="72" autocomplete="current-password">
  <button type="submit">Log in</button>
</form>
<form id="mfa-form" class="card-form" hidden>
  <p>Open your authenticator app and enter the 6-digit code for ByteBox.</p>
  <label for="code">Code</label>
  <input id="code" name="code" required maxlength="6" inputmode="numeric" autocomplete="one-time-code">
  <button type="submit">Verify</button>
  <button id="mfa-cancel" class="btn-ghost" type="button">Use a different account</button>
</form>
<p><a href="forgot.html">Forgot your password?</a> &middot; New here? <a href="signup.html">Create an account</a></p>
</div></section></main>
<footer><p>&copy; 2026 ByteBox. All rights reserved.</p></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
